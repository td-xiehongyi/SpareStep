<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SpareStep · 静态界面样稿</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      color-scheme: light;
      --paper: #faf9f5;
      --ink: #272a24;
      --muted: #575d54;
      --line: #d9dbd2;
      --fern: #405844;
      --sage: #e9eee4;
      --sand: #f2ece0;
      --mist: #e9edf0;
      --lilac: #efebf2;
      font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: var(--paper);
      font-size: 16px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      line-height: 1.6;
    }

    .page {
      width: min(100% - clamp(32px, 9vw, 120px), 1016px);
      margin-inline: auto;
      padding-block: clamp(30px, 7vw, 78px) 64px;
    }

    .masthead {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 23px;
      border-bottom: 1px solid var(--line);
    }

    h1, h2, h3, p { margin: 0; }

    h1 {
      font-size: clamp(2.1rem, 5vw, 3.2rem);
      line-height: 1.04;
      letter-spacing: -.065em;
      font-weight: 760;
    }

    .tagline {
      margin-top: 12px;
      color: var(--muted);
    }

    .preview-label {
      flex-shrink: 0;
      padding-top: 4px;
      color: var(--fern);
      font-size: .875rem;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr);
      gap: clamp(30px, 6vw, 70px);
      padding-top: 26px;
      align-items: start;
    }

    .categories {
      display: grid;
      gap: 22px;
      min-width: 0;
    }

    .category-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 38px;
    }

    .category-heading h2 {
      display: flex;
      gap: 11px;
      align-items: center;
      font-size: 1.22rem;
      line-height: 1.25;
      letter-spacing: -.01em;
    }

    .caret {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-right: 1.7px solid var(--fern);
      border-bottom: 1.7px solid var(--fern);
      transform: translateY(-2px) rotate(45deg);
    }

    .collapsed .caret { transform: translateX(-2px) rotate(-45deg); }

    .category-tools {
      display: flex;
      gap: 13px;
      align-items: center;
      padding-right: 4px;
    }

    .add {
      display: grid;
      width: 29px;
      height: 29px;
      place-items: center;
      border: 1px solid #bec8b9;
      border-radius: 7px;
      color: var(--fern);
      font-size: 1.18rem;
      line-height: 1;
    }

    .grip {
      display: inline-block;
      width: 15px;
      height: 15px;
      background: radial-gradient(circle, currentColor 1px, transparent 1.4px) 0 0 / 5px 5px;
      color: #596457;
      flex: none;
    }

    .task-list {
      display: grid;
      gap: 9px;
      list-style: none;
      padding: 0;
      margin: 6px 0 0;
    }

    .task {
      position: relative;
      min-width: 0;
      padding: 13px 42px 13px 15px;
      border: 1px solid var(--task-border, var(--line));
      border-radius: 9px;
      background: var(--task-background, var(--paper));
      overflow-wrap: anywhere;
    }

    .task .grip {
      position: absolute;
      top: 17px;
      right: 14px;
    }

    .task h3, .sample-title {
      font-size: 1rem;
      font-weight: 680;
      line-height: 1.45;
    }

    .task p {
      margin-top: 4px;
      font-size: .9rem;
      color: var(--muted);
    }

    .task.sage { --task-background: var(--sage); --task-border: #d4decf; }
    .task.sand { --task-background: var(--sand); --task-border: #e4d9c5; }
    .task.mist { --task-background: var(--mist); --task-border: #d3dce1; }
    .task.lilac { --task-background: var(--lilac); --task-border: #ded6e5; }

    .collapsed {
      padding-bottom: 9px;
      border-bottom: 1px solid var(--line);
    }

    .samples {
      min-width: 0;
      padding-left: clamp(20px, 4vw, 39px);
      border-left: 1px solid var(--line);
    }

    .samples h2 {
      margin-bottom: 9px;
      font-size: 1.19rem;
    }

    .sample {
      padding-block: 16px;
      border-bottom: 1px solid var(--line);
    }

    .sample:last-child { border-bottom: 0; }

    .sample h3 {
      margin-bottom: 9px;
      color: var(--muted);
      font-size: .875rem;
      font-weight: 620;
    }

    .hold {
      border-color: #cbd7c6;
      background: var(--sage);
      padding: 12px 13px;
    }

    progress {
      display: block;
      appearance: none;
      width: 100%;
      height: 5px;
      margin-top: 11px;
      overflow: hidden;
      border: 0;
      border-radius: 8px;
      background: #d3ddce;
      color: var(--fern);
    }

    progress::-webkit-progress-bar { background: #d3ddce; }
    progress::-webkit-progress-value { background: var(--fern); }
    progress::-moz-progress-bar { background: var(--fern); }

    .swipe {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: stretch;
      border: 1px solid #dfd0ca;
      border-radius: 9px;
      overflow: hidden;
      background: #eee3df;
    }

    .swipe .sample-title {
      padding: 11px 13px;
      border-right: 1px solid #dfd0ca;
      background: #f7f3ef;
      overflow-wrap: anywhere;
    }

    .delete {
      align-self: center;
      padding-inline: 12px;
      color: #773d33;
      font-size: .9rem;
      font-weight: 670;
    }

    .toast {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 8px 13px;
      border-radius: 999px;
      background: var(--fern);
      color: #fff;
      font-size: .9rem;
    }

    .check {
      display: inline-block;
      width: 10px;
      height: 6px;
      border-left: 1.7px solid currentColor;
      border-bottom: 1.7px solid currentColor;
      transform: translateY(-1px) rotate(-45deg);
    }

    .screen-reader-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    @media (max-width: 720px) {
      .layout {
        grid-template-columns: minmax(0, 1fr);
        gap: 31px;
      }

      .samples {
        padding: 23px 0 0;
        border-inline-start: 0;
        border-top: 1px solid var(--line);
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="masthead">
      <div>
        <h1>SpareStep</h1>
        <p class="tagline">想起来就记下，有空时再看看。</p>
      </div>
      <span class="preview-label">静态样稿</span>
    </header>

    <div class="layout">
      <div class="categories">
        <section aria-labelledby="short">
          <div class="category-heading">
            <h2 id="short"><span class="caret" aria-hidden="true"></span>短期</h2>
            <span class="category-tools" aria-hidden="true"><span class="add">+</span><span class="grip"></span></span>
          </div>
          <ul class="task-list">
            <li class="task sage">
              <h3>补充实验截图，完成报告</h3>
              <p>把运行结果截图补齐，再检查报告格式。</p>
              <span class="grip" aria-hidden="true"></span>
            </li>
            <li class="task sand">
              <h3>准备软件交互项目考核</h3>
              <p>先想三个方向，再整理需要的资料。</p>
              <span class="grip" aria-hidden="true"></span>
            </li>
          </ul>
        </section>

        <section aria-labelledby="long">
          <div class="category-heading">
            <h2 id="long"><span class="caret" aria-hidden="true"></span>长期</h2>
            <span class="category-tools" aria-hidden="true"><span class="add">+</span><span class="grip"></span></span>
          </div>
          <ul class="task-list">
            <li class="task mist">
              <h3>复习概率论与算法</h3>
              <p>每天有空时推进一点。</p>
              <span class="grip" aria-hidden="true"></span>
            </li>
          </ul>
        </section>

        <section aria-labelledby="notes">
          <div class="category-heading">
            <h2 id="notes"><span class="caret" aria-hidden="true"></span>随手记</h2>
            <span class="category-tools" aria-hidden="true"><span class="add">+</span><span class="grip"></span></span>
          </div>
          <ul class="task-list">
            <li class="task lilac">
              <h3>关于多 Agent 协作流程的想法</h3>
              <p>先确认需求，再画原型，最后验证实际体验。</p>
              <span class="grip" aria-hidden="true"></span>
            </li>
          </ul>
        </section>
      </div>

      <aside class="samples" aria-labelledby="samples">
        <h2 id="samples">状态样例</h2>
        <section class="sample">
          <h3>分类已收起</h3>
          <div class="category-heading collapsed">
            <strong><span class="caret" aria-hidden="true"></span> 随手记</strong>
            <span class="category-tools" aria-hidden="true"><span class="add">+</span><span class="grip"></span></span>
          </div>
        </section>
        <section class="sample">
          <h3>长按完成</h3>
          <div class="task hold">
            <p class="sample-title">补充实验截图，完成报告</p>
            <progress value="65" max="100" aria-label="长按完成进度">65%</progress>
          </div>
        </section>
        <section class="sample">
          <h3>左滑露出删除</h3>
          <div class="swipe">
            <p class="sample-title">准备软件交互项目考核</p>
            <span class="delete">删除</span>
          </div>
        </section>
        <section class="sample">
          <h3>操作反馈</h3>
          <p class="toast"><span class="check" aria-hidden="true"></span>已完成，移入归档</p>
        </section>
      </aside>
    </div>
  </main>
</body>
</html>
